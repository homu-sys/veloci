[package]
name = "veloci"
version = "0.1.0"
edition = "2021"
description = "The fastest package manager. Parallel resolver, concurrent downloads, format-agnostic."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/homu-sys/veloci"
homepage = "https://github.com/homu-sys/veloci"
keywords = ["package-manager", "resolver", "downloader", "linux"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "veloci"
path = "src/lib.rs"

[[bin]]
name = "velo"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
futures = "0.3"
clap = { version = "4", features = ["derive", "env", "color", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dashmap = "6"
hex = "0.4"
sha2 = "0.10"
indicatif = "0.17"
toml = "1.1.8"
dirs = "7.0.0"
tar = "0.4.46"
flate2 = "1.1.10"
lzma-rs = "0.3.0"
ruzstd = "0.9.1"
libc = "0.2"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
tempfile = "3.27.0"

[[bench]]
name = "resolver"
harness = false
